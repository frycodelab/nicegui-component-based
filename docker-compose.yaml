services:
  nicegui:
    build: .
    image: template:latest
    container_name: template
    # Publish the app on the host so it is reachable at http://localhost:8080
    ports:
      - "8080:8080"
    environment:
      # Optional: pin the secret by setting STORAGE_SECRET in your shell or a .env file.
      # If left unset, _get_storage_secret() generates and persists a strong one in app/data/.
      - STORAGE_SECRET=${STORAGE_SECRET:-}
      # Bind to all interfaces inside the container so the published port works.
      - HOST=0.0.0.0
    # Mount the app source so data/, logs/ and backup/ persist on the host.
    volumes:
      - ./app:/app
    restart: unless-stopped
